<svg xmlns="http://www.w3.org/2000/svg" width="412" height="68" viewBox="0 0 412 68" role="img" aria-label="blog: jhparkkk.tistory.com">
  <style>
    .mono{font-family:'JetBrains Mono','SF Mono','Cascadia Code',Consolas,'Liberation Mono',monospace}
    .sans{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Segoe UI',sans-serif}
    .blink{animation:blink 1.1s steps(1) infinite}
    .pulse{animation:pulse 4s ease-in-out infinite}
    .scan{animation:scan 2.8s ease-in-out infinite alternate}
    @keyframes blink{50%{opacity:0}}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    @keyframes scan{from{transform:translateY(0)}to{transform:translateY(var(--d,38px))}}
    @media (max-width: 560px){.aside{display:none}.cmd{font-size:20px}}
    @media (prefers-reduced-motion: reduce){.blink,.pulse,.scan{animation:none}}
  </style>
<rect x="0.5" y="0.5" width="411" height="67" rx="12" fill="#0B1626" stroke="#1B2B42"/>
<text x="22" y="42" class="mono" font-size="17" fill="#5CC8FF" font-weight="700">blog</text>
<text x="78" y="42" class="sans" font-size="20" fill="#E6EEF7" >jhparkkk.tistory.com</text>
<path d="M372 41 L384 29 M375.6 29 H384 V32.6" stroke="#5CC8FF" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
