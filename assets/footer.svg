<svg xmlns="http://www.w3.org/2000/svg" width="840" height="60" viewBox="0 0 840 60" role="img" aria-label="exit. 모든 저장소 보기 github.com/junghun133">
  <style>
    .mono{font-family:'JetBrains Mono','SF Mono','Cascadia Code',Consolas,'Liberation Mono',monospace}
    .sans{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Segoe UI',sans-serif}
    .blink{animation:blink 1.1s steps(1) infinite}
    .pulse{animation:pulse 4s ease-in-out infinite}
    .scan{animation:scan 2.8s ease-in-out infinite alternate}
    @keyframes blink{50%{opacity:0}}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    @keyframes scan{from{transform:translateY(0)}to{transform:translateY(var(--d,38px))}}
    @media (max-width: 560px){.aside{display:none}.cmd{font-size:20px}}
    @media (prefers-reduced-motion: reduce){.blink,.pulse,.scan{animation:none}}
  </style>
<rect x="0.5" y="0.5" width="839" height="59" rx="12" fill="#07101C" stroke="#1B2B42"/>
<text x="24" y="37" class="mono" font-size="15" fill="#E6EEF7" ><tspan fill="#5CC8FF">$</tspan> exit</text>
<text x="796" y="37" class="sans" font-size="15" fill="#A3B4C9" text-anchor="end">모든 저장소 보기 <tspan fill="#E6EEF7">github.com/junghun133</tspan></text>
<path d="M804 36 L815 25 M807.3 25 H815 V28.3" stroke="#5CC8FF" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
