<svg xmlns="http://www.w3.org/2000/svg" width="840" height="168" viewBox="0 0 840 168" role="img" aria-label="about: 대용량 메시징과 고트래픽 서비스를 만드는 백엔드 엔지니어입니다. 요즘은 AI Agent, RAG, MCP로 사람의 일을 대신하는 시스템을 만듭니다.">
  <style>
    .mono{font-family:'JetBrains Mono','SF Mono','Cascadia Code',Consolas,'Liberation Mono',monospace}
    .sans{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Segoe UI',sans-serif}
    .blink{animation:blink 1.1s steps(1) infinite}
    .pulse{animation:pulse 4s ease-in-out infinite}
    .scan{animation:scan 2.8s ease-in-out infinite alternate}
    @keyframes blink{50%{opacity:0}}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    @keyframes scan{from{transform:translateY(0)}to{transform:translateY(var(--d,38px))}}
    @media (max-width: 560px){.aside{display:none}.cmd{font-size:20px}}
    @media (prefers-reduced-motion: reduce){.blink,.pulse,.scan{animation:none}}
  </style>
<rect x="0.5" y="0.5" width="839" height="167" rx="12" fill="#0B1626" stroke="#1B2B42"/>
<rect x="1" y="44" width="838" height="1" fill="#1B2B42"/>
<text x="24" y="29" class="mono cmd" font-size="15" fill="#E6EEF7" font-weight="700"><tspan fill="#5CC8FF">$</tspan> cat about.md</text>

<text x="28" y="96" class="sans" font-size="22" fill="#A3B4C9" >대용량 메시징과 고트래픽 서비스를 만드는 백엔드 엔지니어입니다.</text>
<text x="28" y="134" class="sans" font-size="22" fill="#A3B4C9" >요즘은 <tspan fill="#5CC8FF" font-weight="700">AI Agent, RAG, MCP</tspan>로 사람의 일을 대신하는 시스템을 만듭니다.</text>
</svg>
