<svg xmlns="http://www.w3.org/2000/svg" width="840" height="422" viewBox="0 0 840 422" role="img" aria-label="AI Engineering: AI Agent, RAG Pipeline, MCP Server">
  <style>
    .mono{font-family:'JetBrains Mono','SF Mono','Cascadia Code',Consolas,'Liberation Mono',monospace}
    .sans{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Segoe UI',sans-serif}
    .blink{animation:blink 1.1s steps(1) infinite}
    .pulse{animation:pulse 4s ease-in-out infinite}
    .scan{animation:scan 2.8s ease-in-out infinite alternate}
    @keyframes blink{50%{opacity:0}}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    @keyframes scan{from{transform:translateY(0)}to{transform:translateY(var(--d,38px))}}
    @media (max-width: 560px){.aside{display:none}.cmd{font-size:20px}}
    @media (prefers-reduced-motion: reduce){.blink,.pulse,.scan{animation:none}}
  </style>
<rect x="0.5" y="0.5" width="839" height="421" rx="12" fill="#0B1626" stroke="#21587D"/>
<path d="M1 45 H839 V128 H1 Z" fill="#0E2638"/>
<rect x="0.5" y="0.5" width="839" height="421" rx="12" fill="none" stroke="#5CC8FF" stroke-opacity=".45"/>
<rect x="1" y="44" width="838" height="1" fill="#21587D"/>
<text x="24" y="29" class="mono cmd" font-size="15" fill="#E6EEF7" font-weight="700"><tspan fill="#5CC8FF">$</tspan> ls ./what-i-do</text>

<text x="32" y="102" class="sans" font-size="34" fill="#E6EEF7" font-weight="800" letter-spacing="-.5">AI Engineering</text>
<text x="808" y="100" class="sans aside" font-size="16" fill="#A3B4C9" text-anchor="end">요즘 가장 많은 시간을 쓰는 일</text>
<text x="32" y="168" class="sans" font-size="22" fill="#E6EEF7" font-weight="700">AI Agent</text>
<text x="808" y="168" class="mono aside" font-size="15" fill="#8296AE" text-anchor="end">plan, act, observe</text>
<text x="32" y="204" class="sans" font-size="21" fill="#A3B4C9" >Tool calling 기반 멀티스텝 에이전트와 업무 자동화</text>
<rect x="32" y="224" width="776" height="1" fill="#1B2B42"/>
<text x="32" y="264" class="sans" font-size="22" fill="#E6EEF7" font-weight="700">RAG Pipeline</text>
<text x="808" y="264" class="mono aside" font-size="15" fill="#8296AE" text-anchor="end">chunk, embed, retrieve</text>
<text x="32" y="300" class="sans" font-size="21" fill="#A3B4C9" >문서 수집부터 답변 생성까지 검색 증강 파이프라인 구축</text>
<rect x="32" y="320" width="776" height="1" fill="#1B2B42"/>
<text x="32" y="360" class="sans" font-size="22" fill="#E6EEF7" font-weight="700">MCP Server</text>
<text x="808" y="360" class="mono aside" font-size="15" fill="#8296AE" text-anchor="end">tools, resources, prompts</text>
<text x="32" y="396" class="sans" font-size="21" fill="#A3B4C9" >사내 시스템과 데이터를 LLM에 연결하는 MCP 서버 개발</text>
</svg>
