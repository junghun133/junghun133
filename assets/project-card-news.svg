<svg xmlns="http://www.w3.org/2000/svg" width="840" height="220" viewBox="0 0 840 220" role="img" aria-label="card-news: AI가 뉴스를 골라 요약하고, 카드뉴스 이미지와 영상까지 자동으로 만드는 데스크톱 앱">
  <style>
    .mono{font-family:'JetBrains Mono','SF Mono','Cascadia Code',Consolas,'Liberation Mono',monospace}
    .sans{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Segoe UI',sans-serif}
    .blink{animation:blink 1.1s steps(1) infinite}
    .pulse{animation:pulse 4s ease-in-out infinite}
    .scan{animation:scan 2.8s ease-in-out infinite alternate}
    @keyframes blink{50%{opacity:0}}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    @keyframes scan{from{transform:translateY(0)}to{transform:translateY(var(--d,38px))}}
    @media (max-width: 560px){.aside{display:none}.cmd{font-size:20px}}
    @media (prefers-reduced-motion: reduce){.blink,.pulse,.scan{animation:none}}
  </style>
<rect x="0.5" y="0.5" width="839" height="219" rx="12" fill="#0B1626" stroke="#1B2B42"/>
<text x="32" y="54" class="sans" font-size="26" fill="#E6EEF7" font-weight="800" letter-spacing="-.5">card-news</text>
<path d="M166.72 52 L178.72 40 M170.3 40 H178.72 V43.6" stroke="#5CC8FF" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="32" y="94" class="sans" font-size="21" fill="#A3B4C9" >AI가 뉴스를 골라 요약하고, 카드뉴스 이미지와</text>
<text x="32" y="125" class="sans" font-size="21" fill="#A3B4C9" >영상까지 자동으로 만드는 데스크톱 앱</text>
<rect x="32" y="162" width="87" height="36" rx="18" fill="#07101C" stroke="#21587D"/><text x="76" y="186" class="mono" font-size="17" fill="#E6EEF7" text-anchor="middle">OpenAI</text><rect x="127" y="162" width="87" height="36" rx="18" fill="#07101C" stroke="#21587D"/><text x="171" y="186" class="mono" font-size="17" fill="#E6EEF7" text-anchor="middle">Gemini</text><rect x="222" y="162" width="108" height="36" rx="18" fill="#07101C" stroke="#1B2B42"/><text x="276" y="186" class="mono" font-size="17" fill="#A3B4C9" text-anchor="middle">Electron</text><rect x="338" y="162" width="77" height="36" rx="18" fill="#07101C" stroke="#1B2B42"/><text x="376" y="186" class="mono" font-size="17" fill="#A3B4C9" text-anchor="middle">React</text><rect x="423" y="162" width="87" height="36" rx="18" fill="#07101C" stroke="#1B2B42"/><text x="467" y="186" class="mono" font-size="17" fill="#A3B4C9" text-anchor="middle">ffmpeg</text>
