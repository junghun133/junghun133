<svg xmlns="http://www.w3.org/2000/svg" width="840" height="352" viewBox="0 0 840 352" role="img" aria-label="AI: Claude, OpenAI, Gemini, MCP, Claude Code; Backend: Java, Kotlin, Spring Boot, Python, WebFlux, Node.js, GraphQL; Data: MySQL, Oracle, MongoDB, Supabase; Frontend: TypeScript, React, Next.js, Electron, Flutter, three.js; DevOps: Linux, Docker, Jenkins, Git">
  <style>
    .mono{font-family:'JetBrains Mono','SF Mono','Cascadia Code',Consolas,'Liberation Mono',monospace}
