<svg xmlns="http://www.w3.org/2000/svg" width="840" height="204" viewBox="0 0 840 204" role="img" aria-label="Core: Massive Data: 초당 수만 건의 대량 문자·데이터 처리; High Traffic: 수백만 명 규모 서비스 안정화와 성능 최적화; AI Serving: AI 모델 연동과 비용·지연 고려한 서빙">
  <style>
    .mono{font-family:'JetBrains Mono','SF Mono','Cascadia Code',Consolas,'Liberation Mono',monospace}
    .sans{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Segoe UI',sans-serif}
    .blink{animation:blink 1.1s steps(1) infinite}
    .pulse{animation:pulse 4s ease-in-out infinite}
    .scan{animation:scan 2.8s ease-in-out infinite alternate}
    @keyframes blink{50%{opacity:0}}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    @keyframes scan{from{transform:translateY(0)}to{transform:translateY(var(--d,38px))}}
    @media (max-width: 560px){.aside{display:none}.cmd{font-size:20px}}
    @media (prefers-reduced-motion: reduce){.blink,.pulse,.scan{animation:none}}
  </style>
<rect x="0.5" y="0.5" width="839" height="203" rx="12" fill="#0B1626" stroke="#1B2B42"/>
<rect x="1" y="44" width="838" height="1" fill="#1B2B42"/>
<text x="24" y="29" class="mono cmd" font-size="15" fill="#E6EEF7" font-weight="700"><tspan fill="#5CC8FF">$</tspan> ls ./core</text>
<text x="816" y="29" class="sans aside" font-size="15" fill="#8296AE" text-anchor="end">기반 경험</text>
<text x="32" y="100" class="sans" font-size="19" fill="#A3B4C9" font-weight="700">Massive Data</text>
<text x="32" y="138" class="sans" font-size="20" fill="#A3B4C9" ><tspan fill="#E6EEF7" font-weight="700">초당 수만 건</tspan>의 대량</text>
<text x="32" y="168" class="sans" font-size="20" fill="#A3B4C9" >문자·데이터 처리</text>
<rect x="280" y="72" width="1" height="108" fill="#1B2B42"/>
<text x="312" y="100" class="sans" font-size="19" fill="#A3B4C9" font-weight="700">High Traffic</text>
<text x="312" y="138" class="sans" font-size="20" fill="#A3B4C9" ><tspan fill="#E6EEF7" font-weight="700">수백만 명</tspan> 규모 서비스</text>
<text x="312" y="168" class="sans" font-size="20" fill="#A3B4C9" >안정화와 성능 최적화</text>
<rect x="560" y="72" width="1" height="108" fill="#1B2B42"/>
<text x="592" y="100" class="sans" font-size="19" fill="#A3B4C9" font-weight="700">AI Serving</text>
<text x="592" y="138" class="sans" font-size="20" fill="#A3B4C9" >AI 모델 연동과</text>
<text x="592" y="168" class="sans" font-size="20" fill="#A3B4C9" >비용·지연 고려한 서빙</text>
</svg>
